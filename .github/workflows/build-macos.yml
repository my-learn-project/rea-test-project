name: Build macOS

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/build-macos.yml'
      - '.cargo/**'
      - 'crates/**'
      - 'frontend/**'
      - 'tests/**'
      - 'config/xollvm-toolchain.json'
      - 'scripts/**'
      - 'Cargo.*'
      - 'CMakeLists.txt'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Build virtualized authorization policies
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned open-source protector
        shell: pwsh
        run: |
          python -m venv .tools/python
          & ./.tools/python/Scripts/python.exe -m pip install py7zr==1.1.4
          if ($LASTEXITCODE -ne 0) { throw 'Archive tool installation failed.' }
          ./scripts/install-xollvm.ps1
      - name: Generate native Mach-O policy objects
        shell: pwsh
        run: |
          $toolchain = Get-Content .tools/xollvm/toolchain.json -Raw | ConvertFrom-Json
          foreach ($architecture in @('arm64', 'x86_64')) {
            & ./.tools/python/Scripts/python.exe scripts/build-policy.py --target "macos-$architecture" --output "build/protection/macos-$architecture" --clang $toolchain.clang --opt $toolchain.opt
            if ($LASTEXITCODE -ne 0) { throw "Policy virtualization failed for $architecture." }
          }
      - name: Upload policies for native linking and testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virtualized-policies
          path: |
            build/protection/macos-*/authorization_policy.o
            build/protection/macos-*/protection.json
            build/protection/macos-*/xollvm-report.json
          if-no-files-found: error
          retention-days: 14
  macos:
    name: macOS ${{ matrix.arch }}
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PUBLIC_KEY_HEX: ${{ vars.CARDGUARD_PUBLIC_KEY_HEX }}
      CARGO_TERM_COLOR: never
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download matching virtualized policy objects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: virtualized-policies
          path: build/protection
      - name: Validate public trust anchor
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          key = os.environ['PUBLIC_KEY_HEX'].strip().lower()
          if not re.fullmatch(r'[0-9a-fA-F]{64}', key):
              raise SystemExit('Set repository variable CARDGUARD_PUBLIC_KEY_HEX to the existing issuer public key.')
          Path('config/trusted-public-key.hex').write_text(key + '\n')
          PY
      - name: Install pinned build tools and Qt
        run: |
          python3 -m venv "$RUNNER_TEMP/cardguard-tools"
          source "$RUNNER_TEMP/cardguard-tools/bin/activate"
          python3 -m pip install aqtinstall==3.3.0 cmake==4.4.4 ninja==1.13.2
          python3 -m aqt install-qt mac desktop 6.12.0 clang_64 --archives qtbase qttools qttranslations --outputdir "$RUNNER_TEMP/qt"
          echo "$RUNNER_TEMP/cardguard-tools/bin" >> "$GITHUB_PATH"
          echo "QT_ROOT=$RUNNER_TEMP/qt/6.12.0/macos" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup target add --toolchain 1.98.0 '${{ matrix.target }}'
      - name: Create disposable test signing identity
        run: |
          cargo build --locked --release -p license-issuer --target '${{ matrix.target }}'
          python3 - <<'PY'
          import os, secrets, subprocess
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'cardguard-fixture'
          folder.mkdir(mode=0o700)
          password = secrets.token_urlsafe(32)
          fd = os.open(folder / 'passphrase', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w') as output:
              output.write(password + '\n')
          subprocess.run(['target/${{ matrix.target }}/release/license-issuer', 'keygen',
                          '--private-key', str(folder / 'test.private.json'), '--public-key', str(folder / 'public.hex'),
                          '--passphrase-stdin'], input=password + '\n', text=True, check=True)
          Path('config/trusted-public-key.hex').write_text((folder / 'public.hex').read_text())
          PY
      - name: Build and test disposable identity
        run: |
          bash scripts/build-macos.sh --arch '${{ matrix.arch }}'
          app="$(python3 -c 'import json; print(json.load(open("build/macos-${{ matrix.arch }}/artifact.json"))["app"])')"
          python3 scripts/test-macos.py --app "$app" \
            --issuer "$PWD/target/${{ matrix.target }}/release/license-issuer" \
            --private-key "$RUNNER_TEMP/cardguard-fixture/test.private.json" \
            --passphrase-file "$RUNNER_TEMP/cardguard-fixture/passphrase" \
            --report "$PWD/build/macos-${{ matrix.arch }}/integration.json"
      - name: Build final client with project public key
        id: final
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('config/trusted-public-key.hex').write_text(os.environ['PUBLIC_KEY_HEX'].strip().lower() + '\n')
          PY
          bash scripts/build-macos.sh --arch '${{ matrix.arch }}' --skip-tests
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          artifact = json.loads(Path('build/macos-${{ matrix.arch }}/artifact.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('archive=' + artifact['archive'] + '\n')
          PY
      - name: Upload final client
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CardGuard-macos-${{ matrix.arch }}
          path: |
            ${{ steps.final.outputs.archive }}
            ${{ steps.final.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macOS-tests-${{ matrix.arch }}
          path: |
            build/macos-${{ matrix.arch }}/*.json
            build/macos-${{ matrix.arch }}/*.png
          if-no-files-found: ignore
          retention-days: 14
